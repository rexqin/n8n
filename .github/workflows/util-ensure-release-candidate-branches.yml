name: 'Util: Ensure release candidate branches'

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  id-token: write

jobs:
  ensure-release-candidate-branches:
    name: Ensure release-candidate branches
    runs-on: ubuntu-slim
    steps:
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: oidc
          identity-id: 436a2630-fad8-475b-8f00-5ab158e9919e
          project-slug: project-nd-zj
          env-slug: prod
          secret-path: /n8n

      # GITHUB_TOKEN must be stored in Infisical (PAT with contents: write for branch push).
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ env.GITHUB_TOKEN }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ env.GITHUB_TOKEN }}

      - name: Setup NodeJS
        uses: ./.github/actions/setup-nodejs
        with:
          build-command: ''
          install-command: pnpm install --frozen-lockfile --dir ./.github/scripts --ignore-workspace

      - name: Ensure release-candidate branches
        run: node ./.github/scripts/ensure-release-candidate-branches.mjs

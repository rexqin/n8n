name: "Release: Update pointer tag"
run-name: "Update pointer tag: ${{ inputs.track }} -> ${{ inputs.version-tag }}"

on:
  workflow_call:
    inputs:
      track:
        required: true
        type: string
      version-tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      track:
        description: "Release Track"
        required: true
        type: choice
        options: [stable, beta, v1]
      version-tag:
        description: "Version tag (e.g. n8n@2.7.0). Track tag will point to this version tag."
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  update-pointer-tags:
    name: Update pointer tags
    runs-on: ubuntu-slim
    environment: prod

    steps:
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /n8n/ci

      # GITHUB_TOKEN must be stored in Infisical (PAT with contents: write for tag push).
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ env.GITHUB_TOKEN }}
          # We can manage with a shallow clone, since `ensureTagExists` in github-helpers.mjs
          # does a targeted fetch for the tags it needs.
          fetch-depth: 1

      - name: Setup NodeJS
        uses: ./.github/actions/setup-nodejs
        with:
          build-command: ""
          install-command: pnpm install --frozen-lockfile --dir ./.github/scripts --ignore-workspace

      - name: Configure git author
        run: |
          git config user.name "n8n-release-tag-merge[bot]"
          git config user.email "256767729+n8n-release-tag-merge[bot]@users.noreply.github.com"

      - name: Move track tag
        env:
          TRACK: ${{ inputs.track }}
          VERSION_TAG: ${{ inputs.version-tag }}
        run: node ./.github/scripts/move-track-tag.mjs

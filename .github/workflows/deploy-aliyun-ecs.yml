# 将 n8n 栈部署到阿里云 ECS（通过 SSH）
# Infisical：/n8n 与 /n8n/runner 分别导出为仓库根目录下的 .env、.env.runner；上传前由 .github/scripts/sanitize-dotenv-quotes.py 将单引号替换为双引号，再 scp 到 ECS。
# 镜像版本：workflow 入参 n8n_version 通过 `N8N_VERSION=... docker compose ...` 传入（覆盖 .env 中同名项若存在）。
#
# Infisical 中至少配置：
#   - ECS_HOST / ECS_USER / ECS_SSH_PRIVATE_KEY  （仅部署用，不写入 compose env 文件）
#   - ECS_DEPLOY_PATH （可选，仅部署用）
#   - ACR_USERNAME / ACR_PASSWORD / ACR_REGISTRY（可选，用于 ECS 上 docker login）
#   - /n8n、/n8n/runner 下 compose 所需变量（与 docker-compose.yml 中 env_file 对应）

name: "Deploy: Aliyun ECS (n8n)"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch/tag/commit)，留空则用当前触发提交"
        required: false
        default: ""
      n8n_version:
        description: "以内联环境变量传给 compose 的 N8N_VERSION（semver，如 2.14.3）"
        required: false
        default: ""

  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout for docker-compose 等仓库文件（留空则用触发工作流的提交 SHA）"
        required: false
        type: string
        default: ""
      n8n_version:
        description: "以内联环境变量传给 compose 的 N8N_VERSION（semver）"
        required: false
        type: string
        default: ""

concurrency:
  group: deploy-aliyun-ecs
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Aliyun ECS
    runs-on: ubuntu-latest
    environment:
      name: aliyun-ecs

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # workflow_dispatch / workflow_call 可传 ref；否则用触发工作流的提交 SHA
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: oidc
          identity-id: 436a2630-fad8-475b-8f00-5ab158e9919e
          project-slug: project-nd-zj
          env-slug: prod
          secret-path: /n8n

      - name: Fetch secrets from Infisical main
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: oidc
          identity-id: 436a2630-fad8-475b-8f00-5ab158e9919e
          project-slug: project-nd-zj
          env-slug: prod
          export-type: file
          file-output-path: .env
          secret-path: /n8n

      - name: Fetch secrets from Infisical runner
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: oidc
          identity-id: 436a2630-fad8-475b-8f00-5ab158e9919e
          project-slug: project-nd-zj
          env-slug: prod
          export-type: file
          file-output-path: .env.runner
          secret-path: /n8n/runner

      - name: Validate required secrets
        run: |
          test -n "${ECS_HOST:-}" || { echo "::error::Infisical 缺少 ECS_HOST"; exit 1; }
          test -n "${ECS_USER:-}" || { echo "::error::Infisical 缺少 ECS_USER"; exit 1; }
          test -n "${ECS_SSH_PRIVATE_KEY:-}" || { echo "::error::Infisical 缺少 ECS_SSH_PRIVATE_KEY"; exit 1; }

      - name: Deploy with inline N8N_VERSION
        env:
          INPUT_N8N_VERSION: ${{ inputs.n8n_version }}
        run: |
          set -euo pipefail
          DEPLOY_PATH="${ECS_DEPLOY_PATH:-/opt/n8n}"

          VERSION="${INPUT_N8N_VERSION:-}"
          if [ -z "$VERSION" ]; then
            echo "::error::必须提供 n8n_version（用于 N8N_VERSION=... docker compose ...）。"
            exit 1
          fi
          echo "::notice::N8N_VERSION=${VERSION}（通过内联环境变量传入 docker compose）"

          {
            echo "## 部署环境"
            echo ""
            echo "- **N8N_VERSION**：\`${VERSION}\`"
            echo "- **Git SHA**：\`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          mkdir -p ~/.ssh
          printf '%s\n' "$ECS_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$ECS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${ECS_USER}@${ECS_HOST}" "mkdir -p '${DEPLOY_PATH}'"

          for f in ".env" ".env.runner"; do
            if [ ! -s "${GITHUB_WORKSPACE}/${f}" ]; then
              echo "::error::缺少或为空：${GITHUB_WORKSPACE}/${f}（请检查 Infisical export-type: file 是否成功）"
              exit 1
            fi
          done

          python3 .github/scripts/sanitize-dotenv-quotes.py \
            "${GITHUB_WORKSPACE}/.env" \
            "${GITHUB_WORKSPACE}/.env.runner"

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            docker/docker-compose.yml "${ECS_USER}@${ECS_HOST}:${DEPLOY_PATH}/docker-compose.yml"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${GITHUB_WORKSPACE}/.env" "${ECS_USER}@${ECS_HOST}:${DEPLOY_PATH}/.env"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${GITHUB_WORKSPACE}/.env.runner" "${ECS_USER}@${ECS_HOST}:${DEPLOY_PATH}/.env.runner"

          # 拉取 ACR 私有镜像前在 ECS 上登录（凭据来自 Infisical）
          if [ -n "${ACR_USERNAME:-}" ] && [ -n "${ACR_PASSWORD:-}" ]; then
            echo "::notice::正在登录 registry.cn-hangzhou.aliyuncs.com …"
            printf '%s\n' "$ACR_PASSWORD" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              "${ECS_USER}@${ECS_HOST}" \
              "docker login $(printf '%q' "$ACR_REGISTRY") --username $(printf '%q' "$ACR_USERNAME") --password-stdin"
          else
            echo "::notice::未设置 ACR_USERNAME/ACR_PASSWORD，跳过 docker login（公开镜像可直接 pull）"
          fi

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${ECS_USER}@${ECS_HOST}" bash -s -- "$DEPLOY_PATH" "$VERSION" << 'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$1"
          VERSION="$2"
          cd "$DEPLOY_PATH"
          N8N_VERSION="$VERSION" docker compose -f docker-compose.yml down --remove-orphans || true
          N8N_VERSION="$VERSION" docker compose -f docker-compose.yml pull
          N8N_VERSION="$VERSION" docker compose -f docker-compose.yml up -d --remove-orphans
          docker compose ps
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

# This workflow is used to build and push the Docker image for n8nio/n8n and n8nio/runners
#
# - Uses docker-config.mjs for context determination, this determines what needs to be built based on the trigger
# - Uses docker-tags.mjs for tag generation, this generates the tags for the images

name: 'Docker: Build and Push'

env:
  NODE_OPTIONS: '--max-old-space-size=7168'
  NODE_VERSION: '24.13.1'

permissions:
  contents: read
  id-token: write

on:
  schedule:
    - cron: '0 0 * * *'

  workflow_call:
    inputs:
      n8n_version:
        description: 'N8N version to build'
        required: true
        type: string
      release_type:
        description: 'Release type (stable, nightly, dev)'
        required: false
        type: string
        default: 'stable'
      push_enabled:
        description: 'Whether to push the built images'
        required: false
        type: boolean
        default: true

  workflow_dispatch:
    inputs:
      push_enabled:
        description: 'Push image to registry'
        required: false
        type: boolean
        default: true

jobs:
  determine-build-context:
    name: Determine Build Context
    runs-on: ubuntu-latest
    outputs:
      release_type: ${{ steps.context.outputs.release_type }}
      n8n_version: ${{ steps.context.outputs.version }}
      push_enabled: ${{ steps.context.outputs.push_enabled }}
      push_to_docker: ${{ steps.context.outputs.push_to_docker }}
      build_matrix: ${{ steps.context.outputs.build_matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Determine build context
        id: context
        run: |
          node .github/scripts/docker/docker-config.mjs \
            --event "${{ github.event_name }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --branch "${{ github.ref_name }}" \
            --version "${{ inputs.n8n_version }}" \
            --release-type "${{ inputs.release_type }}" \
            --push-enabled "${{ inputs.push_enabled }}"

  build-and-push-docker:
    name: Build App, then Build and Push Docker Image (${{ matrix.platform }})
    needs: determine-build-context
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      # BuildKit may still attach default attestations; some registries reject them (unknown: blob type invalid)
      BUILDX_NO_DEFAULT_ATTESTATIONS: 1
    strategy:
      matrix: ${{ fromJSON(needs.determine-build-context.outputs.build_matrix) }}
    outputs:
      image_ref: ${{ steps.determine-tags.outputs.n8n_primary_tag }}
      primary_manifest_tag: ${{ steps.determine-tags.outputs.n8n_primary_tag }}
      runners_primary_manifest_tag: ${{ steps.determine-tags.outputs.runners_primary_tag }}
      runners_distroless_primary_manifest_tag: ${{ steps.determine-tags.outputs.runners_distroless_primary_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: oidc
          identity-id: 436a2630-fad8-475b-8f00-5ab158e9919e
          project-slug: project-nd-zj
          env-slug: dev
          secret-path: /n8n

      - name: Setup and Build
        uses: ./.github/actions/setup-nodejs
        with:
          build-command: pnpm build:n8n
          enable-docker-cache: 'true'
        env:
          RELEASE: ${{ needs.determine-build-context.outputs.n8n_version }}
          SENTRY_AUTH_TOKEN: ${{ env.SENTRY_AUTH_TOKEN }}

      - name: Determine Docker tags for all images
        id: determine-tags
        run: |
          node .github/scripts/docker/docker-tags.mjs \
            --all \
            --version "${{ needs.determine-build-context.outputs.n8n_version }}" \
            --platform "${{ matrix.docker_platform }}" \
            ${{ needs.determine-build-context.outputs.push_to_docker == 'true' && '--include-docker' || '' }} \
            ${{ needs.determine-build-context.outputs.push_enabled == 'true' && '--include-aliyun' || '' }}

          echo "=== Generated Docker Tags ==="
          cat "$GITHUB_OUTPUT" | grep "_tags=" | while IFS='=' read -r key value; do
            echo "${key}: ${value%%,*}..."  # Show first tag for brevity
          done

      - name: Build n8n Docker image (load to daemon)
        id: build-n8n
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: ./docker/images/n8n/Dockerfile
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            N8N_VERSION=${{ needs.determine-build-context.outputs.n8n_version }}
            N8N_RELEASE_TYPE=${{ needs.determine-build-context.outputs.release_type }}
          platforms: ${{ matrix.docker_platform }}
          # Explicitly disable attestations; some registries (e.g. Aliyun ACR) return "unknown: blob type invalid"
          provenance: false
          sbom: false
          load: true
          push: false
          tags: ${{ steps.determine-tags.outputs.n8n_tags }}

      - name: Build task runners Docker image (Alpine, load to daemon)
        id: build-runners
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: ./docker/images/runners/Dockerfile
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            N8N_VERSION=${{ needs.determine-build-context.outputs.n8n_version }}
            N8N_RELEASE_TYPE=${{ needs.determine-build-context.outputs.release_type }}
          platforms: ${{ matrix.docker_platform }}
          provenance: false
          sbom: false
          load: true
          push: false
          tags: ${{ steps.determine-tags.outputs.runners_tags }}

      - name: Build task runners Docker image (distroless, load to daemon)
        id: build-runners-distroless
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: ./docker/images/runners/Dockerfile.distroless
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            N8N_VERSION=${{ needs.determine-build-context.outputs.n8n_version }}
            N8N_RELEASE_TYPE=${{ needs.determine-build-context.outputs.release_type }}
          platforms: ${{ matrix.docker_platform }}
          provenance: false
          sbom: false
          load: true
          push: false
          tags: ${{ steps.determine-tags.outputs.runners_distroless_tags }}

      - name: Validate Aliyun ACR variables
        if: needs.determine-build-context.outputs.push_enabled == 'true'
        run: |
          test -n "${ACR_REGISTRY:-}" || { echo "::error::Missing ACR_REGISTRY from Infisical"; exit 1; }
          test -n "${ACR_NAMESPACE:-}" || { echo "::error::Missing ACR_NAMESPACE from Infisical"; exit 1; }
          test -n "${ACR_USERNAME:-}" || { echo "::error::Missing ACR_USERNAME from Infisical"; exit 1; }
          test -n "${ACR_PASSWORD:-}" || { echo "::error::Missing ACR_PASSWORD from Infisical"; exit 1; }

      - name: Login to Docker registries
        if: needs.determine-build-context.outputs.push_enabled == 'true'
        uses: ./.github/actions/docker-registry-login
        with:
          login-ghcr: false
          login-dockerhub: ${{ needs.determine-build-context.outputs.push_to_docker == 'true' }}
          dockerhub-username: ${{ env.DOCKER_USERNAME }}
          dockerhub-password: ${{ env.DOCKER_PASSWORD }}

      - name: Login to Aliyun ACR
        if: needs.determine-build-context.outputs.push_enabled == 'true'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ env.ACR_PASSWORD }}

      - name: Push loaded images to registries
        if: needs.determine-build-context.outputs.push_enabled == 'true'
        run: |
          set -euo pipefail
          push_tags_from_csv() {
            local csv="$1"
            [[ -n "$csv" ]] || { echo "::error::empty tag list"; exit 1; }
            IFS=',' read -ra TAGS <<< "$csv"
            for t in "${TAGS[@]}"; do
              t=$(echo "$t" | xargs)
              [[ -n "$t" ]] || continue
              docker push "$t"
            done
          }
          push_tags_from_csv "${{ steps.determine-tags.outputs.n8n_tags }}"
          push_tags_from_csv "${{ steps.determine-tags.outputs.runners_tags }}"
          push_tags_from_csv "${{ steps.determine-tags.outputs.runners_distroless_tags }}"

  create_multi_arch_manifest:
    name: Create Multi-Arch Manifest
    needs: [determine-build-context, build-and-push-docker]
    runs-on: ubuntu-latest
    if: |
      needs.build-and-push-docker.result == 'success' &&
      needs.determine-build-context.outputs.push_enabled == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: oidc
          identity-id: 436a2630-fad8-475b-8f00-5ab158e9919e
          project-slug: project-nd-zj
          env-slug: dev
          secret-path: /n8n

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to Docker registries
        uses: ./.github/actions/docker-registry-login
        with:
          login-ghcr: false
          login-dockerhub: ${{ needs.determine-build-context.outputs.push_to_docker == 'true' }}
          dockerhub-username: ${{ env.DOCKER_USERNAME }}
          dockerhub-password: ${{ env.DOCKER_PASSWORD }}

      - name: Login to Aliyun ACR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ env.ACR_PASSWORD }}

      - name: Create Docker Hub manifests
        if: needs.determine-build-context.outputs.push_to_docker == 'true'
        run: |
          VERSION="${{ needs.determine-build-context.outputs.n8n_version }}"
          DOCKER_BASE="${{ env.DOCKER_USERNAME }}"

          # Create manifests for each image type
          declare -A images=(
            ["n8n"]="${VERSION}"
            ["runners"]="${VERSION}"
            ["runners-distroless"]="${VERSION}-distroless"
          )

          for image in "${!images[@]}"; do
            TAG_SUFFIX="${images[$image]}"
            IMAGE_NAME="${image//-distroless/}"  # Remove -distroless from image name

            echo "Creating Docker Hub manifest for $image"
            docker buildx imagetools create \
              --tag "${DOCKER_BASE}/${IMAGE_NAME}:${TAG_SUFFIX}" \
              "${DOCKER_BASE}/${IMAGE_NAME}:${TAG_SUFFIX}-amd64" \
              "${DOCKER_BASE}/${IMAGE_NAME}:${TAG_SUFFIX}-arm64"
          done

      - name: Create Aliyun ACR manifests
        run: |
          VERSION="${{ needs.determine-build-context.outputs.n8n_version }}"
          ACR_BASE="${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}"
          RELEASE_TYPE="${{ needs.determine-build-context.outputs.release_type }}"

          declare -A images=(
            ["n8n"]="${VERSION}"
            ["runners"]="${VERSION}"
            ["runners-distroless"]="${VERSION}-distroless"
          )

          for image in "${!images[@]}"; do
            TAG_SUFFIX="${images[$image]}"
            IMAGE_NAME="${image//-distroless/}"  # Remove -distroless from image name

            echo "Creating Aliyun ACR manifest for $image"
            if [[ "$RELEASE_TYPE" == "branch" ]]; then
              docker buildx imagetools create \
                --tag "${ACR_BASE}/${IMAGE_NAME}:${TAG_SUFFIX}" \
                "${ACR_BASE}/${IMAGE_NAME}:${TAG_SUFFIX}-amd64"
            else
              docker buildx imagetools create \
                --tag "${ACR_BASE}/${IMAGE_NAME}:${TAG_SUFFIX}" \
                "${ACR_BASE}/${IMAGE_NAME}:${TAG_SUFFIX}-amd64" \
                "${ACR_BASE}/${IMAGE_NAME}:${TAG_SUFFIX}-arm64"
            fi
          done

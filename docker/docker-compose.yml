# 本地部署：n8n + PostgreSQL
# 使用方式：在项目根目录执行 docker compose up -d（standalone 会忽略 deploy 段）
# 访问：http://localhost:80
#
# 阿里云 ECS（Swarm）：deploy-aliyun-ecs.yml 使用 docker stack deploy；需事先 docker swarm init、
# 创建 overlay 网络 ibb8-net，并在 Infisical 配置 ECS_STACK_NAME、ECS_DEPLOY_NODE_ID（目标节点
# docker node ls 的 ID）。stack 部署前用 docker compose config 合并 env_file，因 stack 不直接支持 env_file。
#
# 镜像标签 ${N8N_VERSION}；版本由 CI 内联 N8N_VERSION= 传入。
#
# 使用 Swarm overlay 网络 ibb8-net（需已存在，例如：docker network create -d overlay ibb8-net）
#
# 数据卷：stack 名为 n8n 时，Swarm 默认会生成名为 n8n_n8n-data 的 local 卷。此处声明为 external，
# 请在首次部署前执行：docker volume create n8n_n8n-data（或与 stack 名一致：{STACK}_n8n-data）。

volumes:
  n8n-data:
    external: true
    name: n8n_n8n-data

services:
  n8n:
    image: registry.cn-hangzhou.aliyuncs.com/rexqin/n8n:${N8N_VERSION:-latest}
    user: root:root
    env_file:
      - .env
    ports:
      - 5678:5678
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://127.0.0.1:5678/healthz || exit 1']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - ibb8-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.id == ${ECS_DEPLOY_NODE_ID}
      restart_policy:
        condition: any
        delay: 5s

  runners:
    image: registry.cn-hangzhou.aliyuncs.com/rexqin/runners:${N8N_VERSION:-latest}
    env_file:
      - .env.runner
    # docker stack deploy 校验要求 depends_on 为列表；Swarm 侧不强制顺序。本地 compose 仅保证 n8n 先启动，不等同于 service_healthy。
    depends_on:
      - n8n
    networks:
      - ibb8-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.id == ${ECS_DEPLOY_NODE_ID}
      restart_policy:
        condition: any
        delay: 5s

networks:
  ibb8-net:
    external: true
    name: ibb8-net

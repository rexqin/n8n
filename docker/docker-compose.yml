# 本地部署：n8n + PostgreSQL
# 使用方式：在项目根目录执行 docker compose up -d（standalone 会忽略 deploy 段）
# 访问：http://localhost:80
#
# 阿里云 ECS（Swarm）：deploy-aliyun-ecs.yml 使用 docker stack deploy；需事先 docker swarm init、
# 创建 overlay 网络 ibb8-net，并在 Infisical 配置 ECS_STACK_NAME、ECS_DEPLOY_NODE_ID（目标节点
# docker node ls 的 ID）。stack 部署前用 docker compose config 合并 env_file，因 stack 不直接支持 env_file。
#
# 镜像标签 ${N8N_VERSION}；版本由 CI 内联 N8N_VERSION= 传入。
#
# 使用 Swarm overlay 网络 ibb8-net（需已存在，例如：docker network create -d overlay ibb8-net）

volumes:
  postgres-data:
  n8n-data:

services:
  n8n:
    image: registry.cn-hangzhou.aliyuncs.com/rexqin/n8n:${N8N_VERSION:-latest}
    user: root:root
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - 5678:5678
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://n8n:5678/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ibb8-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.id == ${ECS_DEPLOY_NODE_ID}
      restart_policy:
        condition: any
        delay: 5s

  runners:
    image: registry.cn-hangzhou.aliyuncs.com/rexqin/runners:${N8N_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - .env.runner
    depends_on:
      n8n:
        condition: service_healthy
    networks:
      - ibb8-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.id == ${ECS_DEPLOY_NODE_ID}
      restart_policy:
        condition: any
        delay: 5s

networks:
  ibb8-net:
    external: true
    name: ibb8-net
